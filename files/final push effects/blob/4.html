<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Hex Liquid Core</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #1a1a2e; }
        #scene-container { width: 100vw; height: 100vh; display: block; }
        /* Simple instructions overlay */
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.3);
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            pointer-events: none;
            letter-spacing: 1px;
        }
    </style>
    
    <!-- LOAD THREE.JS AND GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

    <div id="scene-container"></div>
    <div id="instructions">[ SCROLL / MOVE / CLICK ]</div>

    <script>
    // --- PART 1: SHADER UTILS & NOISE ---
    // (Standard Simplex Noise implementation)
    const shaderUtils = {
      noise4: `
      vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
      float mod289(float x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
      vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
      float permute(float x) { return mod289(((x*34.0)+1.0)*x); }
      vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
      float taylorInvSqrt(float r) { return 1.79284291400159 - 0.85373472095314 * r; }
      vec4 grad4(float j, vec4 ip) {
        const vec4 ones = vec4(1.0, 1.0, 1.0, -1.0);
        vec4 p,s;
        p.xyz = floor( fract (vec3(j) * ip.xyz) * 7.0) * ip.z - 1.0;
        p.w = 1.5 - dot(abs(p.xyz), ones.xyz);
        s = vec4(lessThan(p, vec4(0.0)));
        p.xyz = p.xyz + (s.xyz*2.0 - 1.0) * s.www;
        return p;
      }
      #define F4 0.309016994374947451
      float snoise(vec4 v) {
        const vec4  C = vec4( 0.138196601125011, 0.276393202250021, 0.414589803375032, -0.447213595499958);
        vec4 i  = floor(v + dot(v, vec4(F4)) );
        vec4 x0 = v -   i + dot(i, C.xxxx);
        vec4 i0;
        vec3 isX = step( x0.yzw, x0.xxx );
        vec3 isYZ = step( x0.zww, x0.yyz );
        i0.x = isX.x + isX.y + isX.z;
        i0.yzw = 1.0 - isX;
        i0.y += isYZ.x + isYZ.y;
        i0.zw += 1.0 - isYZ.xy;
        i0.z += isYZ.z;
        i0.w += 1.0 - isYZ.z;
        vec4 i3 = clamp( i0, 0.0, 1.0 );
        vec4 i2 = clamp( i0-1.0, 0.0, 1.0 );
        vec4 i1 = clamp( i0-2.0, 0.0, 1.0 );
        vec4 x1 = x0 - i1 + C.xxxx;
        vec4 x2 = x0 - i2 + C.yyyy;
        vec4 x3 = x0 - i3 + C.zzzz;
        vec4 x4 = x0 + C.wwww;
        i = mod289(i);
        float j0 = permute( permute( permute( permute(i.w) + i.z) + i.y) + i.x);
        vec4 j1 = permute( permute( permute( permute (
                   i.w + vec4(i1.w, i2.w, i3.w, 1.0 ))
                 + i.z + vec4(i1.z, i2.z, i3.z, 1.0 ))
                 + i.y + vec4(i1.y, i2.y, i3.y, 1.0 ))
                 + i.x + vec4(i1.x, i2.x, i3.x, 1.0 ));
        vec4 ip = vec4(1.0/294.0, 1.0/49.0, 1.0/7.0, 0.0) ;
        vec4 p0 = grad4(j0,   ip);
        vec4 p1 = grad4(j1.x, ip);
        vec4 p2 = grad4(j1.y, ip);
        vec4 p3 = grad4(j1.z, ip);
        vec4 p4 = grad4(j1.w, ip);
        vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
        p0 *= norm.x;
        p1 *= norm.y;
        p2 *= norm.z;
        p3 *= norm.w;
        p4 *= taylorInvSqrt(dot(p4,p4));
        vec3 m0 = max(0.6 - vec3(dot(x0,x0), dot(x1,x1), dot(x2,x2)), 0.0);
        vec2 m1 = max(0.6 - vec2(dot(x3,x3), dot(x4,x4)            ), 0.0);
        m0 = m0 * m0;
        m1 = m1 * m1;
        return 49.0 * ( dot(m0*m0, vec3( dot( p0, x0 ), dot( p1, x1 ), dot( p2, x2 )))
                     + dot(m1*m1, vec2( dot( p3, x3 ), dot( p4, x4 ) ) ) ) ;
        }
    `,
    };

    // --- PART 2: BUBBLE SHADER (Internal details) ---
    const bubbleShader = {
      vertexShader: `
    varying vec2 vUv; 
    varying vec3 vNormal;
    varying vec3 vPosition;
    varying vec3 eyeVector;
    varying vec3 worldNormal;
    uniform float u_time;
    uniform vec3 u_camPos;
    ${shaderUtils.noise4}
    
    void main() {
      vUv = uv; 
      vNormal = normal;
      // Simple distortion for internal bubbles
      vec3 dispPos = position * (1.0 + snoise(vec4(position * 2.0, u_time * 0.0002)) * 0.1);
      
      vec4 worldPosition = modelMatrix * vec4(dispPos, 1.0);
      eyeVector = normalize(worldPosition.xyz - u_camPos);
      worldNormal = normalize(modelViewMatrix * vec4(normal, 0.0)).xyz;
      
      gl_Position = projectionMatrix * modelViewMatrix * vec4(dispPos, 1.0); 
    }
      `,
      fragmentShader: `
    uniform vec3 u_refColor;
    varying vec3 eyeVector;
    varying vec3 worldNormal;

    float fresnel(vec3 eyeVector, vec3 worldNormal) {
        return pow( 1.0 + dot( eyeVector, worldNormal), 3.0 );
    }

    void main() {
      // Simple Fresnel for bubbles to make them look like air pockets
      float f = fresnel(eyeVector, worldNormal);
      gl_FragColor = vec4(u_refColor, f * 0.5); 
    }
      `,
    }

    // --- PART 3: MAIN HONEY BALL SHADER ---
    const ballshaders = {
      vertexShader: `
    varying vec2 vUv; 
    varying vec3 vNormal;
    varying vec2 vN; // MatCap coords
    varying vec3 eyeVector;
    varying vec3 worldNormal;
    
    uniform float u_time;
    uniform vec3 u_camPos;
    uniform float u_speed1;
    uniform float u_freq1;
    uniform float u_amp1;
    
    float tangentFactor = 0.005;
    ${shaderUtils.noise4}

    vec3 orthogonal(vec3 v) {
      return normalize(abs(v.x) > abs(v.z) ? vec3(-v.y, v.x, 0.0) : vec3(0.0, -v.z, v.y));
    }

    vec3 distorted(vec3 p) {
      // The "Liquid" movement logic
      // Slow, organic movement
      float noiseVal = snoise(vec4(p * u_freq1, u_time * 0.00015 * u_speed1));
      return p * (1.0 + noiseVal * 0.08 * u_amp1);
    }

    void main() {
      vUv = uv; 
      
      // Calculate distorted normals for lighting
      vec3 dispPos = distorted(position);
      vec3 tangent1 = orthogonal(normal);
      vec3 tangent2 = normalize(cross(normal, tangent1));
      vec3 nearby1 = position + tangent1 * tangentFactor;
      vec3 nearby2 = position + tangent2 * tangentFactor;
      vec3 distorted1 = distorted(nearby1);
      vec3 distorted2 = distorted(nearby2);
      
      // Recalculate normal based on distortion
      vNormal = normalize(cross(distorted1 - dispPos, distorted2 - dispPos));

      // MatCap lookup math
      vec3 e = normalize( vec3( modelViewMatrix * vec4(position, 1.0) ) );
      vec3 n = normalize( normalMatrix * vNormal );
      vec3 r = reflect( e, n );
      float m = 2. * sqrt( pow( r.x, 2. ) + pow( r.y, 2. ) + pow( r.z + 1., 2. ) );
      vN = r.xy / m + .5;

      vec4 worldPosition = modelMatrix * vec4(position, 1.0);
      eyeVector = normalize(worldPosition.xyz - u_camPos);
      worldNormal = normalize( modelViewMatrix * vec4(vNormal, 0.0)).xyz;

      gl_Position = projectionMatrix * modelViewMatrix * vec4(dispPos, 1.0); 
    }
      `,
      fragmentShader: `
      uniform sampler2D u_matCap;
      uniform sampler2D u_curRefrTex; // Background Texture
      uniform sampler2D u_bubblesFBO; // Internal Bubble layer
      uniform vec2 u_res;
      uniform float u_ior; // Index of Refraction
      uniform vec3 u_refColor; // The Blue Tint
      uniform float u_lightfac; // Pulse intensity

      varying vec2 vN;
      varying vec3 vNormal;
      varying vec3 eyeVector;
      varying vec3 worldNormal;
      
      float fresnel(vec3 eyeVector, vec3 worldNormal) {
        return pow( 1.0 + dot( eyeVector, worldNormal), 3.0 );
      }
      
      void main() {
        // 1. SCREEN COORDINATES
        vec2 uv = gl_FragCoord.xy / u_res;

        // 2. REFRACTION (Bending the background)
        vec3 normal = worldNormal;
        // Refract the eye vector based on Index of Refraction (IOR)
        // 1.0/u_ior determines how much the background warps
        vec3 refracted = refract(eyeVector, normal, 1.0/u_ior);
        uv += refracted.xy;

        // 3. BACKGROUND & BUBBLES
        vec4 bubblesCol = texture2D(u_bubblesFBO, uv);
        vec4 bgCol = texture2D(u_curRefrTex, uv);
        
        // Darken bubbles to make them look like cavities
        vec4 bubblesMix = mix(bgCol, vec4(0.0, 0.0, 0.0, 1.0), bubblesCol.a * 0.3);

        // 4. MATCAP (Lighting)
        vec4 matCapCol = texture2D(u_matCap, vN);
        
        // TINTING LOGIC:
        // Even though the matcap is beige, we want a dark blue result.
        // We multiply the background color by the MatCap brightness.
        // We also tint the MatCap blue to kill the beige.
        vec4 blueTint = vec4(0.5, 0.6, 1.0, 1.0); 
        vec4 litColor = bubblesMix * (matCapCol * blueTint + 0.1); 

        // 5. FRESNEL (The glowing rim)
        float f = fresnel(eyeVector, normal);
        
        // Final Mix: Base Lit Color + Shiny Blue Rim
        vec4 outCol = mix(litColor, vec4(u_refColor, 1.0), f * 0.8);
      
        // Pulse Light Factor
        outCol *= u_lightfac;

        gl_FragColor = outCol;
      }
        `,
    }

    function remap(value, low1, high1, low2, high2) {
      return low2 + (high2 - low2) * (value - low1) / (high1 - low1)
    }

    // --- BUBBLES FBO (Off-screen rendering of internal particles) ---
    class BubblesFBOClass {
      constructor() {}
      init(THREE, scene, camera, params) {
        this.THREE = THREE
        this.orCamera = camera
        this.camera = camera.clone()
        this.camera.layers.set(1) // Only render layer 1
        this.scene = scene
        this.params = { bubbleCount: params.count }
        
        this.uniforms = {
          u_time: { value: 0. },
          u_camPos: { value: camera.position },
          u_refColor: { value: new THREE.Color(0xaaccff) }
        }
        
        // Create simple bubble geometry
        this.bubbleGeo = new THREE.IcosahedronGeometry(0.1, 1);
        this.bubbleMat = new THREE.ShaderMaterial({
            vertexShader: bubbleShader.vertexShader,
            fragmentShader: bubbleShader.fragmentShader,
            uniforms: this.uniforms,
            transparent: true
        });

        this.generateBubbles()

        // Setup Render Target
        this.FBO = new this.THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight)
      }

      generateBubbles() {
        if (this.bubbles) this.scene.remove(this.bubbles)
        this.bubbles = new this.THREE.Group()
        this.bubbles.layers.set(1) // Render strictly to FBO
        this.scene.add(this.bubbles)

        for (let i = 0; i < this.params.bubbleCount; i++) {
          const mesh = new this.THREE.Mesh(this.bubbleGeo, this.bubbleMat);
          // Randomize positions inside the sphere area
          mesh.position.set(
              (Math.random() - 0.5) * 4,
              (Math.random() - 0.5) * 4,
              (Math.random() - 0.5) * 4
          );
          mesh.scale.multiplyScalar(Math.random() * 1.5 + 0.5);
          mesh.layers.set(1);
          this.bubbles.add(mesh);
        }
      }

      update(renderer, dt) {
        // Slowly rotate bubbles
        this.bubbles.rotation.y += dt * 0.0002;
        this.uniforms.u_time.value += dt;

        // Sync camera
        this.camera.position.copy(this.orCamera.position)
        this.camera.rotation.copy(this.orCamera.rotation)
        
        // Render bubbles to texture
        renderer.setRenderTarget(this.FBO)
        renderer.clear()
        renderer.render(this.scene, this.camera)
        renderer.setRenderTarget(null)
      }

      windowResize() {
        this.FBO.setSize(window.innerWidth, window.innerHeight)
      }
    }
    const BubblesFBO = new BubblesFBOClass()

    // --- MAIN SPHERE CLASS ---
    class HoneyBallClass {
      constructor() {}
      init(THREE, scene, camera, params, matCapUrl) {
        this.texLoader = new THREE.TextureLoader()
        this.scene = scene
        this.params = params
        this.camera = camera

        this.uniforms = {
          u_bubblesFBO: { value: BubblesFBO.FBO.texture },
          u_matCap: { value: this.texLoader.load(matCapUrl) }, 
          u_curRefrTex: { value: null }, // Background texture
          u_res: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
          u_time: { value: 0. },
          
          // Refraction Color (The Deep Blue Rim)
          u_refColor: { value: new THREE.Color(params.reflectionColor) },
          
          // Distortion Params
          u_speed1: { value: 1.5 },   // Speed of wobble
          u_freq1: { value: 0.5 },    // Size of waves (lower is bigger)
          u_amp1: { value: 2.5 },     // Intensity of wobble
          
          u_ior: { value: params.refractionIndex },
          u_lightfac: { value: 1.0 },
          u_camPos: { value: camera.position },
        }

        this.shaderMat = new THREE.ShaderMaterial({
          uniforms: this.uniforms,
          vertexShader: ballshaders.vertexShader,
          fragmentShader: ballshaders.fragmentShader,
        })

        this.rotator = new THREE.Group()
        // High segment count for smooth liquid deformation
        const geom = new THREE.IcosahedronGeometry(2.8, 40) 
        this.ballMesh = new THREE.Mesh(geom, this.shaderMat)
        this.rotator.add(this.ballMesh)
        this.scene.add(this.rotator)
      }

      setRefrTex(texture) {
        this.uniforms.u_curRefrTex.value = texture
      }

      pulse() {
        // Animate the wobble and light on click
        const tl = gsap.timeline();
        tl.to(this.uniforms.u_amp1, { value: 4.5, duration: 0.2, ease: "power2.out" })
          .to(this.uniforms.u_amp1, { value: 2.5, duration: 1.5, ease: "elastic.out(1, 0.3)" });
          
        gsap.to(this.uniforms.u_lightfac, { value: 1.5, duration: 0.1, yoyo: true, repeat: 1 });
      }

      update(dt) {
        this.uniforms.u_time.value += dt
        this.uniforms.u_camPos.value = this.camera.position
        // Subtle idle rotation
        this.rotator.rotation.y += 0.001; 
        this.rotator.rotation.z += 0.0005;
      }

      windowResize() {
        this.uniforms.u_res.value.set(window.innerWidth, window.innerHeight)
      }
    }
    const HoneyBall = new HoneyBallClass()

    // --- MAIN SCENE SETUP ---
    class MainThreeSceneClass {
      constructor() {
        this.params = {
          bubbles: { count: 10 }, // Minimal bubbles like reference
          mainBall: {
            reflectionColor: 0x2244aa, // Bright blue rim
            refractionIndex: 1.15,     // Glass/Water refraction level
          },
        }
        this.then = Date.now()
      }

      init(container, matCapUrl, bgUrl) {
        this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true })
        this.renderer.setSize(window.innerWidth, window.innerHeight)
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)) // High quality
        container.appendChild(this.renderer.domElement)

        this.scene = new THREE.Scene()
        
        // Camera setup
        this.camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100)
        this.camera.position.z = 12

        // Initialize components
        BubblesFBO.init(THREE, this.scene, this.camera, this.params.bubbles)
        HoneyBall.init(THREE, this.scene, this.camera, this.params.mainBall, matCapUrl)

        // Load Background
        const loader = new THREE.TextureLoader();
        loader.load(bgUrl, (texture) => {
            // Important: Set wrapping so the hex grid repeats seamlessly
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            // Scale texture to make hexes appropriate size
            texture.repeat.set(2, 2); 
            
            this.scene.background = texture;
            HoneyBall.setRefrTex(texture);
        });

        // Event Listeners
        window.addEventListener("resize", this.resizeCanvas.bind(this))
        window.addEventListener("click", () => HoneyBall.pulse())
        window.addEventListener("mousemove", this.onMouseMove.bind(this))

        this.update()
      }

      onMouseMove(e) {
        // Parallax Effect
        const x = (e.clientX - window.innerWidth / 2) * 0.005;
        const y = (e.clientY - window.innerHeight / 2) * 0.005;
        gsap.to(this.camera.position, { x: x, y: y, duration: 1 });
        this.camera.lookAt(0,0,0);
      }

      update() {
        requestAnimationFrame(this.update.bind(this))
        const dt = Date.now() - this.then
        
        // Hide Main Ball to render Bubbles FBO
        HoneyBall.ballMesh.visible = false;
        BubblesFBO.update(this.renderer, dt);
        
        // Show Main Ball and render Scene
        HoneyBall.ballMesh.visible = true;
        this.renderer.render(this.scene, this.camera);
        HoneyBall.update(dt)

        this.then = Date.now()
      }

      resizeCanvas() {
        this.renderer.setSize(window.innerWidth, window.innerHeight)
        this.camera.aspect = window.innerWidth / window.innerHeight
        this.camera.updateProjectionMatrix()
        HoneyBall.windowResize()
        BubblesFBO.windowResize()
      }
    }

    const MainThreeScene = new MainThreeSceneClass()

    // --- INITIALIZATION ---
    window.onload = function() {
        const container = document.getElementById('scene-container');
        
        // ----------------------------------------------------
        // IMPORTANT: Ensure these files exist in your folder!
        // ----------------------------------------------------
        const matCapURL = "matcap.png"; 
        const textureURL = "background.jpg"; 

        // If you don't have files yet, the code will try to load them and might fail (black screen).
        // You can test with online URLs by uncommenting below:
        
        // const matCapURL = "https://raw.githubusercontent.com/nidorx/matcaps/master/1024/5C5C5C_C9C9C9_969696_A9A9A9.png"; 
        // const textureURL = "https://img.freepik.com/free-vector/dark-hexagonal-background-with-gradient-color_79603-1409.jpg";

        MainThreeScene.init(container, matCapURL, textureURL);
    };

    </script>
</body>
</html>
