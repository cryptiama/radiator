<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honeyball Effect Extracted</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; }
        canvas { display: block; }
    </style>
    <!-- GSAP for the pulse animation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <!-- Three.js Import Map -->
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.154.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.154.0/examples/jsm/"
        }
      }
    </script>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ==========================================
        // 1. SHADER UTILS (From your shaderUtils.js)
        // ==========================================
        const shaderUtils = {
          noise4: `
          vec4 mod289(vec4 x) {
            return x - floor(x * (1.0 / 289.0)) * 289.0; }
          
          float mod289(float x) {
            return x - floor(x * (1.0 / 289.0)) * 289.0; }
          
          vec4 permute(vec4 x) {
               return mod289(((x*34.0)+1.0)*x);
          }
          
          float permute(float x) {
               return mod289(((x*34.0)+1.0)*x);
          }
          
          vec4 taylorInvSqrt(vec4 r)
          {
            return 1.79284291400159 - 0.85373472095314 * r;
          }
          
          float taylorInvSqrt(float r)
          {
            return 1.79284291400159 - 0.85373472095314 * r;
          }
          
          vec4 grad4(float j, vec4 ip)
            {
            const vec4 ones = vec4(1.0, 1.0, 1.0, -1.0);
            vec4 p,s;
          
            p.xyz = floor( fract (vec3(j) * ip.xyz) * 7.0) * ip.z - 1.0;
            p.w = 1.5 - dot(abs(p.xyz), ones.xyz);
            s = vec4(lessThan(p, vec4(0.0)));
            p.xyz = p.xyz + (s.xyz*2.0 - 1.0) * s.www;
          
            return p;
            }
          
          // (sqrt(5) - 1)/4 = F4, used once below
          #define F4 0.309016994374947451
          
          float snoise(vec4 v)
            {
            const vec4  C = vec4( 0.138196601125011,  // (5 - sqrt(5))/20  G4
                                  0.276393202250021,  // 2 * G4
                                  0.414589803375032,  // 3 * G4
                                 -0.447213595499958); // -1 + 4 * G4
          
          // First corner
            vec4 i  = floor(v + dot(v, vec4(F4)) );
            vec4 x0 = v -   i + dot(i, C.xxxx);
          
          // Other corners
          // Rank sorting originally contributed by Bill Licea-Kane, AMD
            vec4 i0;
            vec3 isX = step( x0.yzw, x0.xxx );
            vec3 isYZ = step( x0.zww, x0.yyz );
            i0.x = isX.x + isX.y + isX.z;
            i0.yzw = 1.0 - isX;
            i0.y += isYZ.x + isYZ.y;
            i0.zw += 1.0 - isYZ.xy;
            i0.z += isYZ.z;
            i0.w += 1.0 - isYZ.z;
          
            // i0 now contains the unique values 0,1,2,3 in each channel
            vec4 i3 = clamp( i0, 0.0, 1.0 );
            vec4 i2 = clamp( i0-1.0, 0.0, 1.0 );
            vec4 i1 = clamp( i0-2.0, 0.0, 1.0 );
          
            vec4 x1 = x0 - i1 + C.xxxx;
            vec4 x2 = x0 - i2 + C.yyyy;
            vec4 x3 = x0 - i3 + C.zzzz;
            vec4 x4 = x0 + C.wwww;
          
          // Permutations
            i = mod289(i);
            float j0 = permute( permute( permute( permute(i.w) + i.z) + i.y) + i.x);
            vec4 j1 = permute( permute( permute( permute (
                       i.w + vec4(i1.w, i2.w, i3.w, 1.0 ))
                     + i.z + vec4(i1.z, i2.z, i3.z, 1.0 ))
                     + i.y + vec4(i1.y, i2.y, i3.y, 1.0 ))
                     + i.x + vec4(i1.x, i2.x, i3.x, 1.0 ));
          
          // Gradients: 7x7x6 points over a cube, mapped onto a 4-cross polytope
            vec4 ip = vec4(1.0/294.0, 1.0/49.0, 1.0/7.0, 0.0) ;
          
            vec4 p0 = grad4(j0,   ip);
            vec4 p1 = grad4(j1.x, ip);
            vec4 p2 = grad4(j1.y, ip);
            vec4 p3 = grad4(j1.z, ip);
            vec4 p4 = grad4(j1.w, ip);
          
          // Normalise gradients
            vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
            p0 *= norm.x;
            p1 *= norm.y;
            p2 *= norm.z;
            p3 *= norm.w;
            p4 *= taylorInvSqrt(dot(p4,p4));
          
          // Mix contributions from the five corners
            vec3 m0 = max(0.6 - vec3(dot(x0,x0), dot(x1,x1), dot(x2,x2)), 0.0);
            vec2 m1 = max(0.6 - vec2(dot(x3,x3), dot(x4,x4)            ), 0.0);
            m0 = m0 * m0;
            m1 = m1 * m1;
            return 49.0 * ( dot(m0*m0, vec3( dot( p0, x0 ), dot( p1, x1 ), dot( p2, x2 )))
                         + dot(m1*m1, vec2( dot( p3, x3 ), dot( p4, x4 ) ) ) ) ;
            }
        `
        };

        // ==========================================
        // 2. BALL SHADERS (From honey-ball-shaders.js)
        // ==========================================
        const ballshaders = {
          vertexShader: `
            varying vec2 vUv; 
            varying vec3 vNormal;
            varying vec3 vPosition;
            varying vec2 vN;
            varying vec3 eyeVector;
            varying vec3 worldNormal;

            uniform float u_time;
            uniform float pi;

            uniform vec3 u_camPos;

            uniform float u_speed1;
            uniform float u_freq1;
            uniform float u_amp1;

            uniform vec3 u_bumpPos;
            uniform float u_bumpInt;
            uniform float u_bumRadius;
            uniform float u_bumAmp;

            float tangentFactor = 0.005;

            ${shaderUtils.noise4}

            float remap(float value, float low1, float high1, float low2, float high2){
              return low2 + (value - low1) * (high2 - low2) / (high1 - low1);
            }

            vec3 orthogonal(vec3 v) {
              return normalize(abs(v.x) > abs(v.z) ? vec3(-v.y, v.x, 0.0)
              : vec3(0.0, -v.z, v.y));
            }

            vec3 distorted(vec3 p) {
              vec3 outPoint = p;
              outPoint = p*(1.+snoise(vec4(p*u_freq1, u_time*0.0001*u_speed1))*0.05*u_amp1);
              return outPoint;
            }

            void main() {
              vUv = uv; 
              vNormal = normal;
              vPosition = position;

              vec3 dispPos = distorted(position);
              vec3 tangent1 = orthogonal(normal);
              vec3 tangent2 = normalize(cross(normal, tangent1));
              vec3 nearby1 = position + tangent1 * tangentFactor;
              vec3 nearby2 = position + tangent2 * tangentFactor;
              vec3 distorted1 = distorted(nearby1);
              vec3 distorted2 = distorted(nearby2);

              vNormal = normalize(cross(distorted1 - dispPos, distorted2 - dispPos));

              vec4 p = vec4( position, 1. );

              vec3 e = normalize( vec3( modelViewMatrix * p ) );
              vec3 n = normalize( normalMatrix * vNormal );

              vec3 r = reflect( e, n );
              float m = 2. * sqrt(
                pow( r.x, 2. ) +
                pow( r.y, 2. ) +
                pow( r.z + 1., 2. )
              );
              vN = r.xy / m + .5;

              vec4 worldPosition = modelMatrix * vec4( position, 1.0);
              eyeVector = normalize(worldPosition.xyz - u_camPos);
              worldNormal = normalize( modelViewMatrix * vec4(vNormal, 0.0)).xyz;

              vec4 modelViewPosition = modelViewMatrix * vec4(dispPos, 1.0);
              gl_Position = projectionMatrix * modelViewPosition; 
            }
          `,
          fragmentShader: `
            // #include <packing> 
            // NOTE: 'packing' is standard threejs, usually included automatically, but we can comment it out if not explicitly used 
            
            uniform sampler2D u_matCap;
            uniform float pi;
            
            uniform sampler2D u_curRefrTex;
            uniform sampler2D u_tarRefrTex;
            uniform float u_transFactor;
            
            uniform sampler2D u_bubblesFBO;
            uniform sampler2D u_bubblesDepth;
            uniform vec2 u_res;
            
            uniform float u_ior;
            uniform float u_blur;
            uniform float u_tintInt;
            uniform float u_lightfac;

            uniform vec3 u_targColor;
            uniform vec3 u_refColor;
            uniform vec3 u_camNear;
            uniform vec3 u_camFar;
            
            varying vec2 vN;
            varying vec3 vNormal;
            varying vec3 vPosition;
            varying vec2 vUv; 
            
            varying vec3 eyeVector;
            varying vec3 worldNormal;
            
            float remap(float value, float low1, float high1, float low2, float high2){
              return low2 + (value - low1) * (high2 - low2) / (high1 - low1);
            }
            
            // NOTE: Blur function was present but not used in main() in your snippet. 
            // I left it here for completeness.
            vec4 blur(sampler2D inputSamp, vec2 uv){
              vec4 outputCol = texture2D(inputSamp, uv);;
            
              float Directions = 16.0; 
              float Quality = 3.0; 
              float Size = 50.0*u_blur; 
              vec2 Radius = Size/u_res;
                
              for( float d=0.0; d<(pi*2.); d+=(pi*2.)/Directions)
              {
                for(float i=1.0/Quality; i<=1.0; i+=1.0/Quality)
                  {
                    outputCol += texture( inputSamp, uv+vec2(cos(d),sin(d))*Radius*i);		
                  }
              }
              return outputCol /= Quality * Directions - 15.0;
            }
            
            float fresnel(vec3 eyeVector, vec3 worldNormal) {
              return pow( 1.0 + dot( eyeVector, worldNormal), 3.0 );
            }
            
            void main() {
              //_REFLECTION LIGHTS MATCAP_
              vec4 matCapCol = texture2D(u_matCap, vN);
            
              //_REFRACTION_
              vec2 uv = gl_FragCoord.xy / u_res;
              vec3 normal = worldNormal;
              float ior = u_ior+(1.-cos(u_transFactor*pi*2.))*0.1;
              vec3 refracted = refract(eyeVector, normal, 1.0/ior);
              uv += refracted.xy;
            
              //_BUBBLES MIX BACKGROUND REFRACTION_
              vec4 bubblesCol = texture2D(u_bubblesFBO,uv);
              vec4 darkerBubbles = mix(bubblesCol, vec4(0., 0., 0., 1.), .2);
              
              vec4 curBgCol = texture2D(u_curRefrTex, uv);
              vec4 tarBgCol = texture2D(u_tarRefrTex, uv);
              vec4 transBgCol = mix(curBgCol, tarBgCol, u_transFactor);
              
              // This is the key mix. If we don't have BubblesFBO, bubblesCol.a is 0.
              vec4 bubblesMixBgOut = mix(transBgCol, darkerBubbles, bubblesCol.a);
            
              //_END MIX_
              vec4 tintedRefrLayer = mix(bubblesMixBgOut,vec4(u_targColor,1.), 0.);
              vec4 matCapLayer = tintedRefrLayer*(matCapCol+.4);
              vec4 outCol = mix(matCapLayer, vec4(u_refColor, 1.), fresnel(eyeVector, normal));
            
              //_LIGHT EFFECT_
              vec4 lighting = vec4(u_lightfac);
              outCol *= lighting;

              gl_FragColor = outCol;
            }
          `,
        }

        // ==========================================
        // 3. HONEYBALL CLASS (From honey-ball.js)
        // ==========================================
        class HoneyBallClass {
          constructor() {
            this.bind()
          }
          init(THREE, scene, camera, params) {
            this.texLoader = new THREE.TextureLoader()
            this.scene = scene
            this.params = params
            this.THREE = THREE
            this.camera = camera
            this.pointInt = new THREE.Vector3()
            this.mIntTarget = 0
            this.animTween = null

            this.animationParamFactors = {
              amplitude: 6,
              frequency: 0.01,
              light: 2.5,
            }

            // --- NOTE: Replaced Local Assets with Online Assets for the Demo ---
            // 1. MatCap (Gives the shiny surface look)
            const matCapTex = this.texLoader.load("https://raw.githubusercontent.com/nidorx/matcaps/master/1024/2F2F2F_E0E0E0_868686_A5A5A5.png");
            // 2. Background Texture (For Refraction)
            const bgTex = this.texLoader.load("https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=2070&auto=format&fit=crop");
            
            // 3. Dummy Texture for Bubbles (Since we don't have bubbles-fbo.js)
            const emptyData = new Uint8Array(4); // 1 pixel, RGBA
            const emptyTex = new THREE.DataTexture(emptyData, 1, 1, THREE.RGBAFormat);
            emptyTex.needsUpdate = true;
            // ------------------------------------------------------------------

            this.uniforms = {
              u_bubblesFBO: {
                value: emptyTex // Replaced BubblesFBO.FBO.texture
              },
              u_bubblesDepth: {
                value: emptyTex // Replaced BubblesFBO.FBO.depthTexture
              },
              u_matCap: {
                value: matCapTex
              },
              u_curRefrTex: {
                value: bgTex
              },
              u_tarRefrTex: {
                value: bgTex
              },
              u_transFactor: {
                value: 0.0,
              },
              u_targColor: {
                value: new THREE.Color(0x323232)
              },
              u_res: {
                value: new THREE.Vector2(window.innerWidth, window.innerHeight)
              },
              u_time: {
                value: 0.,
              },
              u_refColor: {
                value: new THREE.Color(params.reflectionColor)
              },
              u_speed1: { value: 9.18 }, // was 5.18
              u_freq1: { value: 0.55 },
              u_amp1: { value: 2.4 },
              pi: { value: Math.PI },
              u_ior: { value: params.refractionIndex },
              u_blur: { value: params.blur },
              u_tintInt: { value: .05 },
              u_lightfac: { value: 1 },

              u_camPos: { value: camera.position },
              u_camNear: { value: 0. },
              u_camFar: { value: 10. },
            }

            this.shaderMat = new THREE.ShaderMaterial({
              uniforms: this.uniforms,
              vertexShader: ballshaders.vertexShader,
              fragmentShader: ballshaders.fragmentShader,
            })

            this.rotator = new THREE.Group()
            // Increased geometry detail slightly for better noise deformation
            const geom = new THREE.IcosahedronGeometry(2.5, 30) 
            this.ballMesh = new THREE.Mesh(geom, this.shaderMat)
            this.ballMesh.name = "HoneyBall"
            this.rotator.add(this.ballMesh)
            this.scene.add(this.rotator)
          }

          setRefrTex(texture) {
            this.uniforms.u_curRefrTex.value = texture
            this.uniforms.u_tarRefrTex.value = texture
          }

          pulse(clockWise) {
            this.pulseFactor = 0
            if (this.animTween)
              this.animTween.kill()
            this.animTween = gsap.to(this, {
              pulseFactor: 1,
              duration: 2.0, // params.animationParams.pulseAnim.duration (Guessed)
              ease: "power2.out", // params.animationParams.pulseAnim.ease (Guessed)
              yoyo: true,
              repeat: 1,
              onUpdate: () => {
                // this.uniforms.u_speed1.value = 4.18 + this.pulseFactor * 0.1
                this.uniforms.u_freq1.value = 0.55 + this.pulseFactor * this.animationParamFactors.frequency
                this.uniforms.u_amp1.value = 3.0 + this.pulseFactor * this.animationParamFactors.amplitude // was 2.09
                this.uniforms.u_lightfac.value = 1 + this.pulseFactor * this.animationParamFactors.light
              },
            })

            const rotDir = clockWise ? -1 : 1
            gsap.to(this.rotator.rotation, {
              y: this.rotator.rotation.y + rotDir * 2,
              duration: 2.0,
              ease: "power2.out"
            })

          }

          setParams(params) {
            if (params.refractionIndex)
              this.uniforms.u_ior.value = params.refractionIndex
            if (params.reflectionColor)
              this.uniforms.u_refColor.value = new this.THREE.Color(params.reflectionColor)
          }

          update(dt) {
            this.ballMesh.material.uniforms.u_time.value += dt * 10.0; // Multiplied for visibility
            this.ballMesh.material.uniforms.u_camPos.value = this.camera.position
            // Removed FBO depth update since we don't have FBO
          }

          windowResize(THREE) {
            this.ballMesh.material.uniforms.u_res.value = new THREE.Vector2(window.innerWidth, window.innerHeight)
          }

          bind() {
            this.init = this.init.bind(this)
            this.setParams = this.setParams.bind(this)
            this.windowResize = this.windowResize.bind(this)
          }
        }

        // ==========================================
        // 4. MAIN SCENE SETUP
        // ==========================================
        
        // Setup Scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color("#111");
        
        // Add a background plane so we can see the refraction working
        const loader = new THREE.TextureLoader();
        loader.load('https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=2070&auto=format&fit=crop', function(texture){
            scene.background = texture;
        });

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 8;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // HoneyBall Parameters
        const params = {
            reflectionColor: 0xffffff,
            refractionIndex: 1.1, // Honey has high refraction
            blur: 0.5,
            animationParams: {
                pulseAnim: { duration: 2, ease: "power2.inOut" },
                rotationAnim: { duration: 2, ease: "power2.inOut" }
            }
        };

        // Initialize
        const honeyBall = new HoneyBallClass();
        honeyBall.init(THREE, scene, camera, params);

        // Auto Pulse every few seconds to show off the effect
        setInterval(() => {
            honeyBall.pulse(true);
        }, 4000);

        // Resize Handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            honeyBall.windowResize(THREE);
        });

        // Loop
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();
            
            honeyBall.update(dt);
            controls.update();
            renderer.render(scene, camera);
        }

        animate();

    </script>
</body>
</html>
