<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molecular Simulation - Dense & Original Size</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #1a1a1a; }
        #ui {
            position: absolute; top: 10px; left: 10px;
            color: #ddd; font-family: sans-serif;
            background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px;
            pointer-events: none;
            user-select: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>

    <div id="ui">
        <strong>Status:</strong> <span id="status">Running</span><br>
        <small>Images: Original Size | Density: High</small>
    </div>

    <script>
        const Engine = Matter.Engine,
              Render = Matter.Render,
              Runner = Matter.Runner,
              Bodies = Matter.Bodies,
              Composite = Matter.Composite,
              Common = Matter.Common;

        // --- CONFIGURATION ---
        
        // 1. This determines the size of the "hard" physics center.
        //    If your molecules are overlapping TOO much, increase this number (e.g. to 80).
        //    If they are still floating apart, decrease this number (e.g. to 30).
        const PHYSICS_CORE_RADIUS = 38; 

        // 2. Maximum number of items
        const MAX_ITEMS = 350;
        // ---------------------

        const engine = Engine.create();
        const world = engine.world;

        // Create Renderer
        const render = Render.create({
            element: document.body,
            engine: engine,
            options: {
                width: window.innerWidth,
                height: window.innerHeight,
                background: '#1a1a1a', 
                wireframes: false, // Change to TRUE to see the "physics circles" vs the images
                showAngleIndicator: false
            }
        });

        // Walls
        const wallThick = 200;
        const w = window.innerWidth;
        const h = window.innerHeight;
        
        const ground = Bodies.rectangle(w/2, h+wallThick/2, w+200, wallThick, { isStatic: true, render: { fillStyle: '#333'} });
        const leftWall = Bodies.rectangle(0-wallThick/2, h/2, wallThick, h*4, { isStatic: true, render: { fillStyle: '#333'} });
        const rightWall = Bodies.rectangle(w+wallThick/2, h/2, wallThick, h*4, { isStatic: true, render: { fillStyle: '#333'} });

        Composite.add(world, [ground, leftWall, rightWall]);

        // Image List
        const imageUrls = [
            '1 (1).png', '1 (2).png', '1 (3).png', 
            '1 (4).png', '1 (5).png', '1 (6).png', 
            '1 (7).png', '1 (8).png', '1 (9).png'
        ];

        function addMolecule(x, y) {
            const randomImage = Common.choose(imageUrls);

            // We use a CIRCLE for the physics.
            // Circles roll and stack much tighter than hexagons/polygons.
            const body = Bodies.circle(x, y, PHYSICS_CORE_RADIUS, {
                restitution: 0.0,  // No bounce (makes them settle into a pile)
                friction: 0.9,     // High friction (stops them from sliding like ice)
                density: 0.05,     // Heavier than default (helps crush the pile down)
                slop: 0.1,         // Allows slight overlap for softer collisions
                angle: Math.random() * Math.PI * 2,
                render: {
                    sprite: {
                        texture: randomImage,
                        // Scale 1.0 = Original Image Size
                        xScale: 0.6, 
                        yScale: 0.6 
                    }
                }
            });

            Composite.add(world, body);
        }

        // Run Engine
        Render.run(render);
        const runner = Runner.create();
        Runner.run(runner, engine);

        // Spawn Loop
        const spawner = setInterval(() => {
            // Spawn slightly further from edges so big images don't get stuck in walls immediately
            const randomX = Math.random() * (window.innerWidth - 200) + 100;
            addMolecule(randomX, -150);

            if (Composite.allBodies(world).length > MAX_ITEMS) clearInterval(spawner);
        }, 200); // Slight delay increase to account for larger images loading

        // Resize Handling
        window.addEventListener('resize', () => {
            render.canvas.width = window.innerWidth;
            render.canvas.height = window.innerHeight;
            Matter.Body.setPosition(ground, { x: window.innerWidth/2, y: window.innerHeight+100 });
            Matter.Body.setPosition(rightWall, { x: window.innerWidth+100, y: window.innerHeight/2 });
        });

        // Click to Add
        window.addEventListener('mousedown', (e) => addMolecule(e.clientX, e.clientY));

    </script>
</body>
</html>
