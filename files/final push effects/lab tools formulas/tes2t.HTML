<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molecular Lego Simulation</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #1a1a1a; }
        #ui {
            position: absolute; top: 10px; left: 10px;
            color: #ddd; font-family: sans-serif;
            background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px;
            pointer-events: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>

    <div id="ui">
        <strong>Status:</strong> <span id="status">Running</span><br>
        <small>Note: Images must be cropped tightly!</small>
    </div>

    <script>
        const Engine = Matter.Engine,
              Render = Matter.Render,
              Runner = Matter.Runner,
              Bodies = Matter.Bodies,
              Composite = Matter.Composite,
              Common = Matter.Common;

        // --- CONFIGURATION ---
        // Since you are cropping the images, we can make the physics body
        // match the image size more closely.
        const OBJ_SIZE = 80;   
        const IMAGE_SCALE = 0.2; // Adjust this until the image fits the hexagon nicely
        // ---------------------

        const engine = Engine.create();
        const world = engine.world;

        // Create Renderer
        const render = Render.create({
            element: document.body,
            engine: engine,
            options: {
                width: window.innerWidth,
                height: window.innerHeight,
                background: '#1a1a1a',
                wireframes: false, // Set to TRUE if you want to see the hexagons
                showAngleIndicator: false
            }
        });

        // Walls (Thick walls to prevent tunneling)
        const wallThick = 200;
        const w = window.innerWidth;
        const h = window.innerHeight;
        
        const ground = Bodies.rectangle(w/2, h+wallThick/2, w+200, wallThick, { isStatic: true, render: { fillStyle: '#333'} });
        const leftWall = Bodies.rectangle(0-wallThick/2, h/2, wallThick, h*4, { isStatic: true, render: { fillStyle: '#333'} });
        const rightWall = Bodies.rectangle(w+wallThick/2, h/2, wallThick, h*4, { isStatic: true, render: { fillStyle: '#333'} });

        Composite.add(world, [ground, leftWall, rightWall]);

        // Your files (PNGs are preferred for performance)
        const imageUrls = [
            '1 (1).png', '1 (2).png', '1 (3).png', 
            '1 (4).png', '1 (5).png', '1 (6).png', 
            '1 (7).png', '1 (8).png', '1 (9).png'
        ];

        function addMolecule(x, y) {
            const randomImage = Common.choose(imageUrls);

            // We use a POLYGON (6 sides = Hexagon)
            // This stacks better than circles, but rolls better than squares.
            const sides = 6; 
            const radius = OBJ_SIZE / 2;

            const body = Bodies.polygon(x, y, sides, radius, {
                restitution: 0.1, // Low bounce (heavy feel)
                friction: 0.8,    // High friction (like plastic/rubber, not ice)
                chamfer: { radius: 10 }, // ROUNDED CORNERS (Crucial for "Lego" feel)
                angle: Math.random() * Math.PI * 2,
                render: {
                    sprite: {
                        texture: randomImage,
                        xScale: IMAGE_SCALE,
                        yScale: IMAGE_SCALE
                    }
                }
            });

            Composite.add(world, body);
        }

        // Run Engine
        Render.run(render);
        const runner = Runner.create();
        Runner.run(runner, engine);

        // Spawn Loop
        const spawner = setInterval(() => {
            const randomX = Math.random() * (window.innerWidth - 100) + 50;
            addMolecule(randomX, -100);

            // Limit amount to prevent crashing browser
            if (Composite.allBodies(world).length > 400) clearInterval(spawner);
        }, 150);

        // Resize Handling
        window.addEventListener('resize', () => {
            render.canvas.width = window.innerWidth;
            render.canvas.height = window.innerHeight;
            Matter.Body.setPosition(ground, { x: window.innerWidth/2, y: window.innerHeight+100 });
            Matter.Body.setPosition(rightWall, { x: window.innerWidth+100, y: window.innerHeight/2 });
        });

        // Click to Add
        window.addEventListener('mousedown', (e) => addMolecule(e.clientX, e.clientY));

    </script>
</body>
</html>
